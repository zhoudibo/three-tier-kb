name: 反馈 / Feature Request
description: 分享你遇到的问题、建议或新场景
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: 你想解决什么问题？
      description: 描述你当前的场景和卡点，不要贴私有业务数据
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 你的环境
      description: OS、Python 版本、vault 结构（目录树，隐藏真实项目名）
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际输出 / 报错
    validations:
      required: true
  - type: checkboxes
    id: check
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除所有敏感信息（密钥、token、个人数据、私有路径）
          required: true
        - label: 我已删除 / 脱敏真实项目名与内部路径
          required: true
